
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakhi Fastfood</title>

<style>
:root {
  --navy: #17243A;
  --gold: #C5A46D;
  --ivory: #F6F3EC;
  --light-gold: #E8DFC9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--ivory);
  color: #252B35;
  padding-bottom: 85px;
}

header {
  background: var(--navy);
  color: white;
  text-align: center;
  padding: 28px 12px;
  border-bottom: 3px solid var(--gold);
}

.logo {
  font-family: Georgia, serif;
  font-size: 29px;
  margin: 0;
  letter-spacing: 1px;
}

.tagline {
  color: var(--light-gold);
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

h2 {
  font-family: Georgia, serif;
  color: var(--navy);
}

.categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 5px 0 18px;
}

.categories button {
  background: var(--light-gold);
  color: var(--navy);
  border: 1px solid transparent;
  border-radius: 25px;
  padding: 11px 17px;
  font-weight: bold;
  white-space: nowrap;
}

.categories button.active {
  background: var(--navy);
  color: var(--gold);
  border-color: var(--gold);
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.food {
  background: white;
  border: 1px solid #e8e2d6;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 3px 12px #17243A10;
}

.food h3 {
  color: var(--navy);
  font-family: Georgia, serif;
  margin: 8px 0;
}

.food-category {
  color: #777;
  font-size: 12px;
}

.price {
  color: #987442;
  font-size: 17px;
  font-weight: bold;
  margin: 12px 0;
}

.food button, .checkout {
  width: 100%;
  background: var(--navy);
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
}

.cart-box {
  background: white;
  border: 1px solid var(--light-gold);
  border-radius: 13px;
  padding: 17px;
  margin-top: 28px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 13px 0;
  border-bottom: 1px solid #eee8dc;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity button {
  background: var(--light-gold);
  color: var(--navy);
  border: 0;
  border-radius: 5px;
  padding: 7px 11px;
  font-weight: bold;
}

.item-total {
  font-weight: bold;
  color: var(--navy);
}

.total {
  text-align: right;
  font-size: 21px;
  font-weight: bold;
  color: var(--navy);
  margin: 20px 0;
}

.note {
  color: #777;
  font-size: 12px;
  text-align: center;
}

#floatingCart {
  display: block;
  position: fixed;
  bottom: 12px;
  left: 4%;
  width: 92%;
  padding: 15px;
  background: var(--navy);
  color: var(--gold);
  border: 1px solid var(--gold);
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  z-index: 9999;
  box-shadow: 0 4px 16px #0003;
  cursor: pointer;
}

footer {
  background: var(--navy);
  color: var(--light-gold);
  text-align: center;
  padding: 23px 12px;
  margin-top: 30px;
  font-size: 13px;
}

@media (max-width: 420px) {
  .menu {
    grid-template-columns: 1fr;
  }
  .cart-item {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<header>
  <h1 class="logo">LAKHI FASTFOOD</h1>
  <p class="tagline">FRESH FOOD · GREAT TASTE · QUALITY</p>
</header>

<main class="container">

  <h2>Explore Our Menu</h2>

  <div class="categories" id="categories"></div>

  <div class="menu" id="menu"></div>

  <section class="cart-box" id="cart">
    <h2>Your Shopping Cart</h2>

    <div id="cartItems">Your cart is empty.</div>

    <div class="total" id="total">Total: ₹0</div>

    <button class="checkout" onclick="placeOrder()">
      Place Order
    </button>

    <p class="note">
      Demo checkout — online ordering will be connected later.
    </p>
  </section>

</main>

<button id="floatingCart" onclick="openCart()">
  🛒 View Cart · <span id="cartCount">0</span> items · ₹<span id="cartAmount">0</span>
</button>

<footer>
  LAKHI FASTFOOD<br>
  Thank you for choosing us.
</footer>

<script>
const foods = [
  {id:1, name:"Cold Drink", price:30, category:"Beverages"},
  {id:2, name:"Fresh Lime", price:40, category:"Beverages"},
  {id:3, name:"Tea", price:15, category:"Beverages"},
  {id:4, name:"Cheese Burger", price:80, category:"Burgers"},
  {id:5, name:"Chicken Burger", price:100, category:"Burgers"},
  {id:6, name:"Veg Burger", price:60, category:"Burgers"},
  {id:7, name:"Veg Chowmein", price:60, category:"Chowmein"},
  {id:8, name:"Chicken Chowmein", price:90, category:"Chowmein"}
];

const categories = [
  "All",
  "Burgers",
  "Chowmein",
  "Beverages"
];

let cart = {};
let activeCategory = "All";

function renderCategories() {
  document.getElementById("categories").innerHTML =
    categories.map(category => `
      <button
        class="${activeCategory === category ? "active" : ""}"
        onclick="selectCategory('${category}')">
        ${category}
      </button>
    `).join("");
}

function selectCategory(category) {
  activeCategory = category;
  renderCategories();
  renderMenu();
}

function renderMenu() {
  const filtered = activeCategory === "All"
    ? foods
    : foods.filter(food => food.category === activeCategory);

  document.getElementById("menu").innerHTML =
    filtered.map(food => `
      <div class="food">
        <div class="food-category">${food.category}</div>
        <h3>${food.name}</h3>
        <div class="price">₹${food.price}</div>
        <button onclick="addToCart(${food.id})">
          Add to Cart
        </button>
      </div>
    `).join("");
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQuantity(id, change) {
  cart[id] = (cart[id] || 0) + change;

  if (cart[id] <= 0) {
    delete cart[id];
  }

  renderCart();
}

function getTotal() {
  return Object.keys(cart).reduce((sum, id) => {
    const food = foods.find(item => item.id === Number(id));
    return sum + food.price * cart[id];
  }, 0);
}

function getItemCount() {
  return Object.values(cart).reduce((sum, quantity) => {
    return sum + quantity;
  }, 0);
}

function renderCart() {
  const box = document.getElementById("cartItems");
  const ids = Object.keys(cart);
  const floating = document.getElementById("floatingCart");

  if (ids.length === 0) {
    box.innerHTML = "Your cart is empty.";
    document.getElementById("total").innerHTML = "Total: ₹0";
    floating.style.display = "none";
    return;
  }

  box.innerHTML = ids.map(id => {
    const food = foods.find(item => item.id === Number(id));
    const quantity = cart[id];

    return `
      <div class="cart-item">
        <div>
          <strong>${food.name}</strong><br>
          <small>₹${food.price} × ${quantity}</small>
        </div>

        <div class="quantity">
          <button onclick="changeQuantity(${id}, -1)">−</button>
          ${quantity}
          <button onclick="changeQuantity(${id}, 1)">+</button>
        </div>

        <div class="item-total">
          ₹${food.price * quantity}
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("total").innerHTML =
    "Total: ₹" + getTotal();

  document.getElementById("cartCount").innerText =
    getItemCount();

  document.getElementById("cartAmount").innerText =
    getTotal();

  floating.style.display = "block";
}

function openCart() {
  document.getElementById("cart").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function placeOrder() {
  if (Object.keys(cart).length === 0) {
    alert("Your cart is empty!");
    return;
  }

  const name = prompt("Please enter your name:");

  if (!name || !name.trim()) {
    return;
  }

  const phone = prompt("Enter your 10-digit mobile number:");

  if (!phone || !/^[6-9][0-9]{9}$/.test(phone.trim())) {
    alert("Please enter a valid 10-digit mobile number.");
    return;
  }

  alert(
    "Thank you, " + name.trim() +
    "!\nYour demo order is ready." +
    "\nPhone: " + phone.trim() +
    "\nTotal: ₹" + getTotal()
  );
}

renderCategories();
renderMenu();
renderCart();
</script>

</body>
</html>
