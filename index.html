
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Platform</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf3;color:#252525}
header{background:#171717;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;color:#ffb52e}
header p{margin:8px 0 0;color:#ddd}
.container{max-width:850px;margin:auto;padding:18px}
h2{margin-top:24px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:10px 0}
.categories button{border:0;border-radius:22px;padding:11px 17px;background:#eee;white-space:nowrap}
.categories button.active{background:#ffb52e}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.item{background:white;border-radius:14px;padding:15px;box-shadow:0 2px 9px #0001}
.item h3{font-size:16px;margin:5px 0 10px}
.price{font-weight:bold;color:#d66a00}
.item button,.checkout{background:#171717;color:white;border:0;border-radius:9px;padding:10px;width:100%;margin-top:12px}
.cart{position:sticky;bottom:10px;background:#ffb52e;padding:15px;border-radius:12px;margin-top:22px;display:flex;justify-content:space-between;align-items:center}
.cart button{background:#171717;color:white;border:0;padding:11px 16px;border-radius:8px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>🍔 Lakhi Fastfood</h1>
<p>Fresh food • Great taste • Quick service</p>
</header>

<main class="container">
<h2>Our Menu</h2>
<p>Choose your favourite food and add it to your cart.</p>

<div class="categories" id="categories"></div>
<div class="menu" id="menu"></div>

<div class="cart">
<strong>🛒 Cart: <span id="count">0</span> items</strong>
<strong id="total">₹0</strong>
<button onclick="showCart()">View Cart</button>
</div>
</main>

<footer>Powered by Restaurant Platform</footer>

<script>
const foods=[
["Beverages","Cold Drink",30],
["Beverages","Fresh Lime",40],
["Beverages","Tea",15],
["Burgers","Cheese Burger",80],
["Burgers","Chicken Burger",100],
["Burgers","Veg Burger",60],
["Chowmein","Chicken Chowmein",120],
["Chowmein","Egg Chowmein",90],
["Chowmein","Veg Chowmein",70],
["Fried Rice","Chicken Fried Rice",130],
["Fried Rice","Egg Fried Rice",100],
["Fried Rice","Veg Fried Rice",80],
["Rolls","Chicken Roll",100],
["Rolls","Egg Roll",70],
["Rolls","Veg Roll",50]
];

let selected="All";
let cart=[];

function categories(){
const names=["All",...new Set(foods.map(f=>f[0]))];
document.getElementById("categories").innerHTML=names.map(n=>
`<button class="${selected===n?'active':''}" onclick="filterMenu('${n}')">${n}</button>`
).join("");
}

function filterMenu(name){
selected=name;
categories();
renderMenu();
}

function renderMenu(){
const list=selected==="All"?foods:foods.filter(f=>f[0]===selected);
document.getElementById("menu").innerHTML=list.map((f)=>`
<div class="item">
<small>${f[0]}</small>
<h3>${f[1]}</h3>
<div class="price">₹${f[2]}</div>
<button onclick="addToCart('${f[1]}',${f[2]})">+ Add</button>
</div>`).join("");
}

function addToCart(name,price){
cart.push({name,price});
updateCart();
}

function updateCart(){
document.getElementById("count").textContent=cart.length;
document.getElementById("total").textContent="₹"+cart.reduce((s,i)=>s+i.price,0);
}

function showCart(){
if(!cart.length){alert("Your cart is empty.");return;}
let details=cart.map(i=>i.name+" - ₹"+i.price).join("\n");
alert("Your order:\n\n"+details+"\n\nTotal: ₹"+cart.reduce((s,i)=>s+i.price,0)+"\n\nThis is a demo cart. Online ordering will be connected next.");
}

categories();
renderMenu();
</script>
</body>
</html>
